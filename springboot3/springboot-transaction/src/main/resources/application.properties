spring.application.name=springboot-transaction

#\u6570\u636E\u6E90
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/spring6
spring.datasource.username=root
spring.datasource.password=1234

#\u914D\u7F6Emybatis
mybatis.mapper-locations=classpath:/mapper/*.xml
#\u9A7C\u5CF0\u547D\u540D\u6CD5
mybatis.configuration.map-underscore-to-camel-case=true
#\u8BBE\u7F6E\u522B\u540D
mybatis.type-aliases-package=com.example.springboot.bean


server.error.include-message=always

#\u4E3A\u7279\u5B9A\u7684\u7C7B\u8BBE\u7F6E\u7EA7\u522B\u4E3ADEBUG
logging.level.com.example.springboot.service.AccountService=DEBUG

#mapper\u76F8\u5173\u7684\u65E5\u5FD7\u7EA7\u522B
logging.level.com.example.springboot.repository=DEBUG

#\u5C06\u65E5\u5FD7\u8F93\u51FA\u5230\u6587\u4EF6 \u7B2C\u4E00\u79CD\u914D\u7F6E\u65B9\u5F0F \u4F7F\u7528path
#\u81EA\u52A8\u5728\u6307\u5B9A\u7684\u76EE\u5F55\u4E0B\u751F\u6210\u4E00\u4E2A\u56FA\u5B9A\u4E0D\u53D8\u7684\u6587\u4EF6\uFF1A spring.log \u540D\u5B57\u4E0D\u53EF\u914D\u7F6E ./\u9ED8\u8BA4\u5728\u8BE5\u9879\u76EE\u7684\u6839\u8DEF\u5F84\u4E0B\u521B\u5EFA
logging.file.path=./log/

#\u5C06\u65E5\u5FD7\u8F93\u51FA\u5230\u6587\u4EF6 \u7B2C\u4E8C\u79CD\u914D\u7F6E\u65B9\u5F0F \u4F7F\u7528name
#name\u548Cpath\u540C\u65F6\u5B58\u5728\u7684\u8BDD path\u5C06\u5931\u6548\uFF08\u4E0D\u80FD\u540C\u65F6\u5B58\u5728\uFF09 name\u53EA\u80FD\u8BBE\u7F6E\u65E5\u5FD7\u6587\u4EF6\u7684\u540D\u5B57 \u4E0D\u80FD\u8BBE\u7F6E\u8BE5\u6587\u4EF6\u7684\u4F4D\u7F6E \u9ED8\u8BA4\u5728\u9879\u76EE\u7684\u6839\u8DEF\u5F84\u4E0B
logging.file.name=my.log


#\u6EDA\u52A8\u65E5\u5FD7\u914D\u7F6E
#\u65E5\u5FD7\u6587\u4EF6\u5230\u8FBE\u591A\u5927\u65F6\u8FDB\u884C\u5F52\u6863
logging.logback.rollingpolicy.max-file-size=100MB

#\u6240\u6709\u7684\u5F52\u6863\u65E5\u5FD7\u6587\u4EF6\u603B\u5171\u8FBE\u5230\u591A\u5927\u65F6\u8FDB\u884C\u5220\u9664 \u9ED8\u8BA4\u662F0B\u8868\u793A\u4E0D\u5220\u9664
logging.logback.rollingpolicy.total-size-cap=50GB

#\u5F52\u6863\u65E5\u5FD7\u6587\u4EF6\u6700\u591A\u4FDD\u7559\u51E0\u5929
logging.logback.rollingpolicy.max-history=60

#\u542F\u52A8\u9879\u76EE\u65F6\u662F\u5426\u8981\u6E05\u7406\u5F52\u6863\u65E5\u5FD7\u6587\u4EF6
logging.logback.rollingpolicy.clean-history-on-start=false

#\u5F52\u6863\u65E5\u5FD7\u6587\u4EF6\u540D\u7684\u683C\u5F0F
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz