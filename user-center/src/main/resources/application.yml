spring:
  application:
    name: user-center
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/hc
    username: root
    password: 1234
  session:
    timeout: 86400
    store-type: redis
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  profiles:
    active: dev
    #redis配置
  data:
    redis:
      port: 6379
      host: localhost
      database: 0
  devtools:
    remote:
      restart:
        enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true
server:
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        domain: localhost
mybatis-plus:
  #  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
  #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config: #配置逻辑删除
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段
      logic-delete-value: 1  # 逻辑已删除值 默认为 1
      logic-not-delete-value: 0 # 逻辑未删除值 默认为 0
springdoc:
  packages-to-scan: com.hc.user.controller
# 文件上传配置
upload:
  avatar-path: ./upload/avatars/
  avatar-access-url: http://localhost:8080/api/uploads/avatars/
  allowed-types: image/jpeg,image/png,image/jpg,image/gif,image/webp